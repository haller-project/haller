[project]
name = "haller"
version = "1"
description = "Haller, handwritten BIP39 word recognizer: training pipeline (Haller-1 is used by SeedSigner)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    # imported by seedsigner.helpers.handwriting (SeedSigner source on PYTHONPATH)
    "embit",
]

[project.optional-dependencies]
# train, filter
train = ["torch"]
# names
names = ["pyarrow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["haller"]
